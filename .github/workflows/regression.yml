name: regression

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy matplotlib qutip quimb python-pptx

      # 计算回归：24 个核算/模拟脚本（路径已重构为 pathlib 相对路径，CI 安全）
      - name: Run computations and simulations
        run: python run_all.py

      # 图件套件（阶段 6.2 路径重构后纳入 CI）：7 幅中文图 + 英文全套
      - name: Build figures (CN + EN)
        run: |
          python figures/01_decision_matrix.py
          python figures/02_reality_stack.py
          python figures/03_rt_mincut.py
          python figures/04_fifth_force.py
          python figures/05_gie_discrimination.py
          python figures/06_reachability.py
          python figures/generate_en.py

      # 论文编译：16 份 Typst → PDF（8 篇论文中英双版）
      - uses: typst-community/setup-typst@v3
      - name: Compile papers
        run: python build/build_pdf.py

      # 幻灯片构建（python-pptx）
      - name: Build slides
        run: python ppt/build_ppt.py
